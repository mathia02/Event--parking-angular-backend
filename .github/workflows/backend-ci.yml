name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore EventParkingReservationSystem.sln

      - name: Build
        run: dotnet build EventParkingReservationSystem.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test EventParkingReservationSystem.sln --configuration Release --no-build